{% extends 'base.html' %}

{% block title %}অ্যাকাউন্টে লগইন করুন - NovaMart{% endblock %}

{% block content %}
<div class="py-12 max-w-md mx-auto">
    <div class="bg-white border border-slate-200 rounded-3xl p-8 shadow-sm">
        <h2 class="text-2xl font-black text-slate-900 text-center mb-6">অ্যাকাউন্টে লগইন করুন</h2>

        {% if form.errors %}
        <div class="bg-rose-50 text-rose-600 text-xs p-3 rounded-xl mb-4">
            ইউজারনেম অথবা পাসওয়ার্ড সঠিক নয়। পুনরায় চেষ্টা করুন।
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">ইউজারনেম</label>
                <input type="text" name="username" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">পাসওয়ার্ড</label>
                <input type="password" name="password" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition text-sm">
                লগইন করুন
            </button>
        </form>

        <p class="text-center text-xs text-slate-500 mt-6">
            অ্যাকাউন্ট নেই? <a href="{% url 'customer_register' %}" class="text-indigo-600 font-bold hover:underline">এখানে নিবন্ধন করুন</a>
        </p>
    </div>
</div>
{% endblock %}
